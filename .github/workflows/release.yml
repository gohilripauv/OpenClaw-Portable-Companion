name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; must match versions.json
        required: true
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: portable-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./versions.json').wrapperVersion")"
          test "$RELEASE_TAG" = "$expected"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --draft \
            --prerelease \
            --title "OpenClaw Portable Companion $RELEASE_TAG (Preview)" \
            --notes-file docs/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Draft releases do not expose their tag ref until publication.
          # Build the immutable workflow-dispatch commit that the draft targets.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run portable checks
        shell: powershell
        run: .\scripts\Test-Portable.ps1

      - name: Build verified bundle
        shell: powershell
        run: .\scripts\Build-Portable.ps1 -Architecture '${{ matrix.architecture }}'

      - name: Test completed release ZIP
        shell: powershell
        run: |
          $zip = (Get-ChildItem -LiteralPath .\dist -Filter '*.zip').FullName
          $checksum = (Get-ChildItem -LiteralPath .\dist -Filter 'SHA256SUMS-*.txt').FullName
          .\scripts\Test-ReleaseZip.ps1 -ZipPath $zip -ChecksumPath $checksum

      - name: Store verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.architecture }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
            dist/SBOM-*.cdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          for checksum in dist/SHA256SUMS-*.txt; do
            (cd dist && sha256sum --check "$(basename "$checksum")")
          done

      - name: Upload and publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/*.zip \
            dist/SHA256SUMS-*.txt \
            dist/SBOM-*.cdx.json \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
